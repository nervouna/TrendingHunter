[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trending-hunter"
version = "0.1.0"
license = "WTFPL"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "httpx[socks]>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "types-PyYAML>=6.0",
]

[project.scripts]
th = "trending_hunter.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_decorators = false
warn_return_any = true
